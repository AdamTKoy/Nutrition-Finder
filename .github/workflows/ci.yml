name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SPOONACULAR_API_KEY: ""
      GOOGLE_MAPS_SERVER_API_KEY: ""
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit and endpoint tests
        run: npm test

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:e2e -- --reporter=list,html

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Upload browser test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
